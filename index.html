<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HACKCHECK — Professional Hackathon Registration & Attendance Management System. QR code scanning, team management, CSV import/export." />
  <meta name="theme-color" content="#09090B" />

  <title>HACKCHECK — Hackathon Registration</title>

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- html5-qrcode CDN (camera-based QR scanning) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- QRCode.js CDN (QR code generation) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- EmailJS CDN (frontend email dispatch) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
  <!-- App mounts here via UI.init() -->
  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#09090B;color:#fff;font-family:sans-serif;flex-direction:column;gap:16px;">
      <div style="font-size:3rem">⚡</div>
      <h1>HACKCHECK requires JavaScript</h1>
      <p style="color:#A1A1AA">Please enable JavaScript to use this application.</p>
    </div>
  </noscript>

  <!-- Modules (order matters: dependencies first) -->
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/qremail.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/scanner.js"></script>

  <!-- Bootstrap -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
</html>
